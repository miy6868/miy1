<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한국사2 단기 완성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 줄 학습 앱 — 위 고정 머리줄 + 아래 탭바, 본문은 최대 760px 한 단. 형광펜(핵심어)과 연도 숫자가 시각적 중심 */
:root {
  --paper: #F2F4F8;
  --surface: #FFFFFF;
  --ink: #161B2A;
  --muted: #586075;
  --line: #DADEE8;
  --accent: #2A4B8D;
  --accent-soft: #E2E9F6;
  --on-accent: #FFFFFF;
  --mark: #FFE07A;
  --mask: #C7CEDD;
  --good: #16804E;
  --good-soft: #DFF2E8;
  --bad: #B53B19;
  --bad-soft: #FBE6DE;
  --tip-soft: #FFF3D3;
  --tip-ink: #7A5200;
  --g-gov: #2A4B8D; --g-arm: #2E6A4C; --g-eui: #A33A27; --g-move: #8A5A10; --g-cult: #6A4890; --g-lib: #1D6D7F;
  --shadow: 0 1px 2px rgba(22, 27, 42, .06), 0 4px 14px rgba(22, 27, 42, .05);
  --f-display: 'Gowun Batang', 'Nanum Myeongjo', 'Noto Serif KR', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1119; --surface: #161A25; --ink: #E6E9F1; --muted: #9AA2B6; --line: #283043;
    --accent: #93AEEA; --accent-soft: #1D2943; --on-accent: #0E1119;
    --mark: rgba(250, 204, 21, .36); --mask: #394259;
    --good: #4FC48C; --good-soft: #10301F; --bad: #F1906B; --bad-soft: #3A1D13;
    --tip-soft: #2B2412; --tip-ink: #F2C969;
    --g-gov: #93AEEA; --g-arm: #7CC7A0; --g-eui: #F0937A; --g-move: #E2B565; --g-cult: #C2A5E6; --g-lib: #7BC7D8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1119; --surface: #161A25; --ink: #E6E9F1; --muted: #9AA2B6; --line: #283043;
  --accent: #93AEEA; --accent-soft: #1D2943; --on-accent: #0E1119;
  --mark: rgba(250, 204, 21, .36); --mask: #394259;
  --good: #4FC48C; --good-soft: #10301F; --bad: #F1906B; --bad-soft: #3A1D13;
  --tip-soft: #2B2412; --tip-ink: #F2C969;
  --g-gov: #93AEEA; --g-arm: #7CC7A0; --g-eui: #F0937A; --g-move: #E2B565; --g-cult: #C2A5E6; --g-lib: #7BC7D8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.65;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* 머리줄 */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--f-display); font-size: 19px; letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 6px; }
.dchip { font-family: var(--f-num); font-weight: 600; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--accent); color: var(--on-accent); white-space: nowrap; }
.dchip[hidden] { display: none; }

main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 110px; display: grid; gap: 18px; }
main > * { min-width: 0; }

/* 아래 탭바 */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tab { background: none; border: 0; padding: 8px 0 9px; white-space: nowrap; display: grid; justify-items: center; gap: 1px; font-size: 11.5px; font-weight: 600; color: var(--muted); text-decoration: none; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); }

/* 공통 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.h2 { font-family: var(--f-display); font-size: 21px; line-height: 1.35; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 12px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 10px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  text-decoration: none; color: var(--ink); min-height: 42px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px;
  font-size: 13px; font-weight: 600; color: var(--muted); min-height: 34px;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.tag { font-family: var(--f-body); font-variant-numeric: tabular-nums; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.todo { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.pill.weak { background: var(--bad-soft); color: var(--bad); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; user-select: none; }
.switch input { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; margin: 0; cursor: pointer; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(16px); }

/* 형광펜 핵심어 */
mark.k { background: linear-gradient(transparent 52%, var(--mark) 52%); color: inherit; padding: 0 1px; border-radius: 2px; font-weight: 600; }
.blank mark.k { background: var(--mask); color: transparent; border-radius: 5px; cursor: pointer; transition: color .15s, background .15s; }
.blank mark.k.open { background: linear-gradient(transparent 52%, var(--mark) 52%); color: inherit; }

/* 홈 */
.hero { display: grid; gap: 14px; }
.dday-wrap { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.dday-num { font-family: var(--f-num); font-weight: 600; font-size: clamp(44px, 12vw, 64px); line-height: 1; letter-spacing: -.03em; color: var(--accent); }
.dday-cap { font-size: 13px; color: var(--muted); font-weight: 600; }
.date-field { display: grid; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.date-field input { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 10px; font-family: var(--f-num); color: var(--ink); }
.scope-line { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 12px; }
.stat3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 2px; }
.stat b { font-family: var(--f-num); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 600; }
.bar { height: 6px; background: var(--paper); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.plan { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.plan li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.plan li:last-child { border-bottom: 0; }
.plan .d { font-family: var(--f-num); font-weight: 600; font-size: 13px; color: var(--muted); padding-top: 2px; }
.plan li.today .d { color: var(--accent); }
.plan li.today { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); margin-inline: -18px; padding-inline: 18px; }
.plan .what { display: grid; gap: 2px; min-width: 0; }
.plan .what b { font-size: 14.5px; }
.plan .what span { font-size: 13px; color: var(--muted); }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.quick .btn { flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; text-align: left; min-height: 58px; padding: 10px 14px; }
.quick .btn small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.secrow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.secrow:last-child { border-bottom: 0; }
.secrow .t { min-width: 0; display: grid; gap: 4px; }
.secrow .t b { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
.acc { font-family: var(--f-num); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 개념 */
.unit-h { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
.unit-h .no { font-family: var(--f-display); font-size: 26px; color: var(--accent); }
.unit-h h2 { font-family: var(--f-display); font-size: 18px; }
.seclink { display: grid; gap: 6px; text-decoration: none; color: inherit; }
.seclink:hover { border-color: var(--accent); }
.seclink .top-line { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.seclink h3 { font-size: 17px; font-weight: 700; line-height: 1.4; }
.seclink p { margin: 0; font-size: 13.5px; color: var(--muted); }
.sec-head { display: grid; gap: 8px; }
.sec-head h1 { font-family: var(--f-display); font-size: clamp(24px, 6vw, 30px); line-height: 1.3; }
.oneline { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-weight: 500; font-size: 14.5px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 53px); z-index: 10; background: var(--paper); padding-block: 8px; border-bottom: 1px solid var(--line); }
.topic h3 { font-size: 17px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.topic h3 .n { font-family: var(--f-num); font-size: 13px; color: var(--accent); }
.topic ul { margin: 0; padding-left: 1.1em; display: grid; gap: 7px; }
.topic li::marker { color: var(--accent); }
.tip { margin-top: 12px; background: var(--tip-soft); color: var(--tip-ink); border-radius: 10px; padding: 9px 12px; font-size: 13.5px; font-weight: 600; display: flex; gap: 8px; }
.tip::before { content: "시험"; flex: none; font-size: 11px; font-weight: 700; border: 1.5px solid currentColor; border-radius: 6px; padding: 0 5px; height: 20px; line-height: 17px; margin-top: 1px; }
.confuse { display: grid; gap: 0; }
.confuse div { display: grid; grid-template-columns: minmax(0, 9em) 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.confuse div:last-child { border-bottom: 0; }
.confuse b { color: var(--bad); }
.keys { margin: 0; padding: 0; list-style: none; counter-reset: k; display: grid; gap: 8px; }
.keys li { counter-increment: k; display: grid; grid-template-columns: 26px 1fr; gap: 8px; font-size: 14.5px; }
.keys li::before { content: counter(k); font-family: var(--f-num); font-size: 12px; font-weight: 600; color: var(--on-accent); background: var(--accent); border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; margin-top: 2px; }
.cover li > span { transition: filter .15s; }
.cover li:not(.open) > span { filter: blur(6px); cursor: pointer; user-select: none; }
.secnav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.secnav .btn { flex-direction: column; align-items: flex-start; text-align: left; font-size: 13.5px; }
.secnav .btn small { color: var(--muted); font-weight: 500; font-size: 11.5px; }
.secnav .next { align-items: flex-end; text-align: right; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13.5px; }
th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { background: var(--accent-soft); color: var(--accent); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 700; }

/* 연표 */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chips .chip { flex: none; }
.tl { position: relative; display: grid; gap: 0; }
.tl-year { display: grid; grid-template-columns: 74px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.tl-y { font-family: var(--f-num); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.2; }
.tl-y.big { font-size: 24px; }
.hideyear .tl-y { color: transparent; background: var(--mask); border-radius: 8px; height: 28px; cursor: pointer; }
.hideyear .tl-y.open { color: var(--accent); background: none; }
.hideyear .tl-m { visibility: hidden; }
.hideyear .tl-year.open .tl-m { visibility: visible; }
.tl-evs { display: grid; gap: 6px; min-width: 0; }
.tl-ev { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: baseline; font-size: 14.5px; }
.tl-ev.major { font-weight: 700; }
.tl-m { font-family: var(--f-num); font-size: 12px; color: var(--muted); }

/* 문제 */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--f-num); font-size: 13px; color: var(--muted); }
.qcard { display: grid; gap: 14px; }
.qq { font-size: 17px; font-weight: 700; line-height: 1.5; }
.src { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 12px 14px; font-size: 14.5px; white-space: pre-line; font-family: var(--f-display); line-height: 1.7; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 26px 1fr; gap: 8px; font-size: 15px; line-height: 1.5; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .num { font-family: var(--f-num); font-weight: 600; color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ox .opt { display: grid; place-items: center; grid-template-columns: 1fr; font-size: 34px; font-weight: 700; padding: 16px; font-family: var(--f-num); }
.fb { border-radius: 12px; padding: 12px 14px; font-size: 14.5px; display: grid; gap: 4px; }
.fb.ok { background: var(--good-soft); }
.fb.no { background: var(--bad-soft); }
.fb b { font-size: 15px; }
.fb.ok b { color: var(--good); }
.fb.no b { color: var(--bad); }
.progress { height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.strip { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.strip .an { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; display: grid; line-height: 1.35; max-width: 100%; }
.strip .an b { font-family: var(--f-num); color: var(--accent); font-size: 12px; }
.strip .gap { align-self: center; font-weight: 700; color: var(--accent); font-size: 14px; }
.order-pick { display: grid; gap: 8px; }
.order-pick .opt { grid-template-columns: 26px 1fr; }
.order-pick .opt .num { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; color: var(--muted); }
.order-pick .opt.picked .num { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.order-ans { margin: 0; padding-left: 1.3em; display: grid; gap: 3px; font-size: 14px; }
.order-ans .y { font-family: var(--f-num); font-size: 12.5px; color: var(--muted); margin-right: 6px; }
.result-num { font-family: var(--f-num); font-size: 56px; font-weight: 600; color: var(--accent); line-height: 1; }
.wlist { display: grid; gap: 0; }
.witem { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 3px; font-size: 14px; }
.witem:last-child { border-bottom: 0; }
.witem .a { color: var(--good); font-weight: 600; }

/* 암기 카드 */
.flash { perspective: 1200px; }
.flash-in { position: relative; display: grid; min-height: 230px; transition: transform .45s; transform-style: preserve-3d; cursor: pointer; }
.flash.flip .flash-in { transform: rotateY(180deg); }
.face { position: relative; grid-area: 1 / 1; min-height: 230px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; text-align: center; padding: 22px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.face.back { transform: rotateY(180deg); background: var(--accent-soft); }
.face .big { font-family: var(--f-display); font-size: clamp(22px, 6vw, 28px); line-height: 1.35; }
.face .desc { font-size: 16px; line-height: 1.6; }
.face .hint { position: absolute; bottom: 10px; left: 0; right: 0; font-size: 12px; color: var(--muted); }
.face > div { padding-bottom: 14px; }
.cdeeds { margin: 0; padding-left: 1.1em; text-align: left; display: grid; gap: 6px; font-size: 15px; }
.flash-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn.know { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.dunno { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }

/* 인물 */
.mono { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--f-display); font-weight: 700; font-size: 14.5px; letter-spacing: -.05em; color: var(--on-accent); background: var(--accent); }
.mono.sm { width: 32px; height: 32px; font-size: 12px; }
.mono.g-gov { background: var(--g-gov); } .mono.g-arm { background: var(--g-arm); } .mono.g-eui { background: var(--g-eui); }
